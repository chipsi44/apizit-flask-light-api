[project]
name = "flask-data-api"
version = "1.0.0"
description = "A small Flask API for descriptive statistics, normalization, and correlation."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "flask>=3.1,<4",
    "numpy>=2.0,<3",
    "pandas>=2.2,<3",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
